server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: distributed-rate-limit-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    gateway:
      routes:
        - id: api
          uri: ${UPSTREAM_URI:http://localhost:8081}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# All policy checks use Redis Lua scripts. The same settings must be deployed to every gateway instance.
drt:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    algorithm: ${RATE_LIMIT_ALGORITHM:TOKEN_BUCKET} # TOKEN_BUCKET, SLIDING_WINDOW_LOG, SLIDING_WINDOW_COUNTER
