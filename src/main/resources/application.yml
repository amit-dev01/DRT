server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: distributed-rate-limit-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    gateway:
      routes:
        - id: api
          uri: ${UPSTREAM_URI:http://localhost:8081}
